[project]
name = "sl-sign-language"
version = "0.1.0"
description = "Real-time Sri Lankan Sign Language Translation System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow-cpu==2.15.1",
    "tensorflow-io-gcs-filesystem==0.31.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem==0.37.1; sys_platform != 'win32'",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
    "mediapipe==0.10.14",
    "opencv-python==4.9.0.80",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "python-multipart==0.0.9",
    "websockets==12.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-dotenv==1.0.1",
    "pillow==10.3.0",
    "requests==2.32.2",
    "tensorflow==2.15.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "httpx==0.27.0",
]

