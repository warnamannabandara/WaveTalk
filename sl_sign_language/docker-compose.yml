# ============================================================
# SLSL Translation System — Docker Compose
# ============================================================

version: "3.9"

services:
  slsl-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: wavetalk/slsl-api:latest
    container_name: slsl-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist trained models between container restarts
      - ./saved_models:/app/saved_models
      # Persist collected keypoint data
      - ./data:/app/data
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  default:
    name: wavetalk-network
    driver: bridge
